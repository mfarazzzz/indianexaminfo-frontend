# ─────────────────────────────────────────────────────────────────────────────
# NOT THE LIVE EDGE — DO NOT TRUST THIS FILE AS PRODUCTION TRUTH.
#
# indianexaminfo.com is served through the Hostinger hcdn edge, which terminates
# TLS and proxies straight to the Node app (the app sees an internal Host of
# 0.0.0.0:3000, not the public hostname). nginx does NOT sit in front of the app
# in the current deployment, so nothing here is actually running:
#   • No CI step or running process reads this file. It is referenced only by a
#     manual copy step in DEPLOY.md and by prose in the docs/audit reports.
#   • The apex→www and http→https behaviour described here is NOT what the site
#     does today. The bare-domain→www 301 is configured in hPanel (host level),
#     not here — a host-based redirect cannot live in the Next.js app either,
#     because the edge strips the public Host header before the app sees it.
#   • Note line 4 uses $server_name, which resolves to the FIRST name listed
#     (the bare apex), so even this template would redirect to the apex, not www
#     — another reason it does not reflect the intended canonical host.
#
# Treat this as a dormant self-hosted fallback template only. Verify live redirect
# behaviour with curl against the real edge; do not infer it from this file.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name indianexaminfo.com www.indianexaminfo.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name indianexaminfo.com www.indianexaminfo.com;

    # SSL (Let's Encrypt — run: certbot --nginx -d indianexaminfo.com -d www.indianexaminfo.com)
    ssl_certificate     /etc/letsencrypt/live/indianexaminfo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indianexaminfo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options   "nosniff"                    always;
    add_header X-Frame-Options          "SAMEORIGIN"                 always;
    add_header X-XSS-Protection         "1; mode=block"              always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml font/woff2;

    # Cache Next.js static assets (hashed filenames — safe to cache forever)
    location /_next/static/ {
        alias /var/www/indianexaminfo-frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache public icons / images
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cache llms.txt for AI crawlers
    location = /llms.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Proxy everything else to Next.js app on port 3002
    location / {
        proxy_pass              http://localhost:3002;
        proxy_http_version      1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
